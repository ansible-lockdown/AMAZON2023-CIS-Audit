---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_3_3_2_4 }}
kernel-param:
  net.ipv6.conf.all.accept_redirects:
    title: 3.3.2.4 | Ensure net.ipv6.conf.all.accept_redirects is configured | running config
    skip: {{ not .Vars.amzn2023cis_ipv6_required }}
    skip-reason: IPv6 is not required, amzn2023cis_ipv6_required is false
    value: '0'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.2.4
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
command:
  cis_3_3_2_4_sysctl_conf:
    title: 3.3.2.4 | Ensure net.ipv6.conf.all.accept_redirects is configured | effective systemd-sysctl config
    skip: {{ not .Vars.amzn2023cis_ipv6_required }}
    skip-reason: IPv6 is not required, amzn2023cis_ipv6_required is false
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv6(\.|/)conf(\.|/)all(\.|/)accept_redirects\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv6.conf.all.accept_redirects=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv6\.conf\.all\.accept_redirects=0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.2.4
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
  {{ end }}
{{ end }}
