---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_3_3_3_1 }}
file:
  pwhistory_remember_system_auth:
    title: 5.3.3.3.1 | Ensure password history remember is configured | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/(?i)^\s*password\s+(requisite|required)\s+pam_pwhistory\.so\s+([^#\n\r]+\s+)?remember=(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b/'
    skip: {{ not .Vars.amzn2023cis_disruption_high }}
    skip-reason: amzn2023cis_disruption_high is false, the role does not change this setting
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.3.3.1
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  pwhistory_remember_password_auth:
    title: 5.3.3.3.1 | Ensure password history remember is configured | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/(?i)^\s*password\s+(requisite|required)\s+pam_pwhistory\.so\s+([^#\n\r]+\s+)?remember=(2[4-9]|[3-9][0-9]|[1-9][0-9]{2,})\b/'
    skip: {{ not .Vars.amzn2023cis_disruption_high }}
    skip-reason: amzn2023cis_disruption_high is false, the role does not change this setting
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.3.3.1
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
