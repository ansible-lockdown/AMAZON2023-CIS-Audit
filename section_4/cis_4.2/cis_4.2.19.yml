---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_2_19 }}
command:
  sshd_config_logingrace:
    title: 4.2.19 | Ensure SSH LoginGraceTime is set to one minute or less
    exec: sshd -T 2>/dev/null | grep -i -- '^logingracetime\s'
    exit-status: 0
    stdout:
    - '/^logingracetime ([1-9]|[1-5][0-9]|60)$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.2.19
      NISTSP800-53-R5:
      - CM-6
  {{ end }}
{{ end }}
