---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_6_1_2_7 }}
command:
  rsyslog_not_log_server:
    title: 6.1.2.7 | Ensure rsyslog is not configured as a log server
    skip: {{ .Vars.amzn2023cis_system_is_log_server }}
    skip-reason: the system is a log server (amzn2023cis_system_is_log_server is true)
    {{ if and .Vars.amzn2023cis_level_1 .Vars.amzn2023cis_rule_6_1_2_1 }}
    depends-on:
    - package:rsyslog
    {{ end }}
    exec: |
      grep -Psi -- '^\h*module\(load="?(imtcp|imudp|imptcp|imrelp)"?' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psi -- '^\h*input\(type="?(imtcp|imudp|imptcp|imrelp)"?' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psi -- '^\h*\$ModLoad\h+(imtcp|imudp|imptcp|imrelp)\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psi -- '^\h*\$(InputTCPServerRun|UDPServerRun|InputPTCPServerRun|InputRELPServerRun)\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      echo check_complete
    exit-status: 0
    stdout:
    - '/^check_complete$/'
    - '!/(?i)(imtcp|imudp|imptcp|imrelp|ServerRun)/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2.7
      CISv8:
      - 4.8
      - 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-12
      - AU-2
      - AU-7
      - CM-6
  {{ end }}
{{ end }}
