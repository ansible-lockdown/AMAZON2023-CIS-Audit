---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_3_2 }}
command:
  sudoers_pty:
    title: 4.3.2 | Ensure sudo commands use pty | use_pty set
    exec: grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?use_pty\b' /etc/sudoers /etc/sudoers.d/
    exit-status: 0
    stdout:
    - '/use_pty/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.3.2
      NISTSP800-53-R5: NA
  pty_sudoers_d:
    title: 4.3.2 | Ensure sudo commands use pty | !use_pty not set
    exec: grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?!use_pty\b' /etc/sudoers /etc/sudoers.d/
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.3.2
      NISTSP800-53-R5: NA
  {{ end }}
{{ end }}
