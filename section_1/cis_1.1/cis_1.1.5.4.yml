---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_5_4 }}
mount:
  var_log_nosuid_opts:
    title: 1.1.5.4 | Ensure nosuid option set on /var/log partition
    exists: true
    mountpoint: /var/log
    opts:
    - nosuid
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.5.4
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
