---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_4_1_7 }}
file:
  cis_2_4_1_7_cron_yearly:
    title: 2.4.1.7 | Ensure access to /etc/cron.yearly is configured
    skip: {{ or (not .Discovered.cronie_installed) (not .Discovered.cron_yearly_present) }}
    skip-reason: cron is not installed or /etc/cron.yearly does not exist, both are a passing state
    path: /etc/cron.yearly
    exists: true
    filetype: directory
    owner: root
    group: root
    mode:
      match-regexp: '^0[0-7]00$'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.4.1.7
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
