---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_6_3 }}
mount:
  var_log_audit_nodev_opts:
    title: 1.1.6.3 | Ensure nodev option set on /var/log/audit partition
    exists: true
    mountpoint: /var/log/audit
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.6.3
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
