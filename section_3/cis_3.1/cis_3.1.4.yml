---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_3_1_4 }}
command:
  rds_disabled:
    title: 3.1.4 | Ensure RDS is disabled | modprobe
    exit-status: 0
    exec: "modprobe -n -v rds | grep -E '(rds|install)'"
    stdout:
    - install /bin/true
    meta:
      server: 2
      workstation: NA
      CIS_ID: 3.1.4
file:
  blacklist_rds:
    title: 3.1.4 | Ensure RDS is disabled | blacklist
    exists: true
    path: /etc/modprobe.d/blacklist.conf
    contents:
    - '/^blacklist rds/'
    meta:
      server: 2
      workstation: NA
      CIS_ID: 3.1.4
      NISTSP800-53-R5: CM-7
  {{ end }}
{{ end }}
