---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_4_2 }}
file:
  authselect_faillock:
    title: 4.4.2 | Ensure authselect includes with-faillock
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/auth\s+required\s+pam_faillock.so/'
    - '/auth\s+required\s+pam_faillock.so preauth silent/'
    - '/auth\s+required\s+pam_faillock.so authfail/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.4.2
      NISTSP800-53-R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  /etc/pam.d/system-auth:
    title: 4.4.2 | Ensure authselect includes with-faillock
    exists: true
    contents:
    - '/auth\s+required\s+pam_faillock.so/'
    - '/auth\s+required\s+pam_faillock.so preauth silent/'
    - '/auth\s+required\s+pam_faillock.so authfail/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.4.2
      NISTSP800-53-R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
