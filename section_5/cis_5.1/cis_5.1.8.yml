---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_1_8 }}
command:
  sshd_access_limited:
    title: 5.1.8 | Ensure sshd access is configured
    exec: sshd -T 2>/dev/null | grep -Pi -- '^\h*(allow|deny)(users|groups)\h+\H+'
    exit-status: 0
    stdout:
    - '/(?i)^(allow|deny)(users|groups)\s+\S+/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.1.8
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
