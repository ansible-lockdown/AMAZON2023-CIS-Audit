---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_3_1_1 }}
command:
  {{ if not .Vars.amzn2023cis_ipv6_required }}
  cis_3_1_1_ipv6_disabled:
    title: 3.1.1 | Ensure IPv6 status is identified | IPv6 disabled
    exec: |
      if [ `grep 1 /proc/sys/net/ipv6/conf/all/disable_ipv6` ] || [ `grep 1 /proc/sys/net/ipv6/conf/default/disable_ipv6` ] || [ `cat /sys/module/ipv6/parameters/disable` == 1 ]; \
      then \
      echo 'ipv6_disabled'; \
      else echo 'fail'; \
      fi
    exit-status: 0
    stdout:
    - 'ipv6_disabled'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.1.1
      CISv8: 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
  {{ if .Vars.amzn2023cis_ipv6_required }}
  cis_3_1_1_ipv6_required:
    title: 3.1.1 | Ensure IPv6 status is identified | IPv6 enabled
    exec: |
      if [ `grep 0 /proc/sys/net/ipv6/conf/all/disable_ipv6` ] || [ `grep 0 /proc/sys/net/ipv6/conf/default/disable_ipv6` ] || [ `cat /sys/module/ipv6/parameters/disable` == 0 ]; \
      then \
      echo 'ipv6_enabled'; \
      else echo 'fail'; \
      fi
    exit-status: 0
    stdout:
    - 'ipv6_enabled'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.1.1
      CISv8: 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
  {{ if not .Vars.amzn2023cis_ipv6_required }}
  {{ if eq .Vars.amzn2023cis_ipv6_disable_method "sysctl" }}
  cis_3_1_1_ipv6_disabled_sysctl:
    title: 3.1.1 | Ensure IPv6 status is identified | IPv6 disabled via sysctl
    exec: sysctl -a 2>/dev/null | grep -E 'net.ipv6.conf.(all|default).disable_ipv6 = 1'
    exit-status: 0
    stdout:
    - 'net.ipv6.conf.all.disable_ipv6 = 1'
    - 'net.ipv6.conf.default.disable_ipv6 = 1'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.1.1
      CISv8: 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
  {{ if eq .Vars.amzn2023cis_ipv6_disable_method "kernel" }}
  cis_3_1_1_ipv6_disabled_kernel:
    title: 3.1.1 | Ensure IPv6 status is identified | IPv6 disabled via kernel parameter on every boot entry
    exec: grubby --info=ALL 2>/dev/null | awk '/^args=/{ if ($0 ~ /ipv6\.disable=1/) ok++; else bad++ } END { printf "ok=%d bad=%d\n", ok, bad }'
    exit-status: 0
    stdout:
    - '/^ok=[1-9][0-9]* bad=0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.1.1
      CISv8: 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
  {{ end }}
  {{ end }}
{{ end }}
