---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_8_3 }}
mount:
  dev_shm_noexec_opts:
    title: 1.1.8.3 | Ensure noexec option set on /dev/shm partition
    exists: true
    mountpoint: /dev/shm
    opts:
    - noexec
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.8.3
      CISv8:
      - 3.3
      - 4.8
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NISTSP800-53-R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
