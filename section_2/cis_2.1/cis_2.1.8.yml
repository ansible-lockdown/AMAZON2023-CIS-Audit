---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_8 }}
    {{ if not .Vars.amzn2023cis_nfs_mask }}
package:
  cis_2_1_8_nfs_utils_pkg:
    title: 2.1.8 | Ensure network file system services are not in use | nfs-utils not installed
    skip: {{ .Vars.amzn2023cis_nfs_server }}
    skip-reason: an NFS server is required, amzn2023cis_nfs_server is true
    name: nfs-utils
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.8
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.amzn2023cis_nfs_mask }}
service:
  cis_2_1_8_nfs_server_service_masked:
    title: 2.1.8 | Ensure network file system services are not in use | nfs-server.service masked
    skip: {{ .Vars.amzn2023cis_nfs_server }}
    skip-reason: an NFS server is required, amzn2023cis_nfs_server is true
    name: nfs-server.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.8
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
