---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_3_3_2_2 }}
kernel-param:
  net.ipv6.conf.all.forwarding:
    title: 3.3.2.2 | Ensure net.ipv6.conf.all.forwarding is configured | running config
    skip: {{ or .Vars.amzn2023cis_is_router (not .Vars.amzn2023cis_ipv6_required) }}
    skip-reason: {{ if .Vars.amzn2023cis_is_router }}this host is a router, amzn2023cis_is_router is true{{ else }}IPv6 is not required, amzn2023cis_ipv6_required is false{{ end }}
    value: '0'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.2.2
      NIST800-53R5: CM-6
command:
  cis_3_3_2_2_sysctl_conf:
    title: 3.3.2.2 | Ensure net.ipv6.conf.all.forwarding is configured | effective systemd-sysctl config
    skip: {{ or .Vars.amzn2023cis_is_router (not .Vars.amzn2023cis_ipv6_required) }}
    skip-reason: {{ if .Vars.amzn2023cis_is_router }}this host is a router, amzn2023cis_is_router is true{{ else }}IPv6 is not required, amzn2023cis_ipv6_required is false{{ end }}
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv6(\.|/)conf(\.|/)all(\.|/)forwarding\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv6.conf.all.forwarding=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv6\.conf\.all\.forwarding=0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.2.2
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
