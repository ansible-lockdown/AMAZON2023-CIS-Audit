---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_6_2 }}
mount:
  var_log_audit_noexec_opts:
    title: 1.1.6.2 | Ensure noexec option set on /var/log/audit partition
    exists: true
    mountpoint: /var/log/audit
    opts:
    - noexec
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.6.2
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
