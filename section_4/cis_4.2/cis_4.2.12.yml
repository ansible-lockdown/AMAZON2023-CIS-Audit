---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_4_2_12 }}
file:
  sshd_config_x11:
    title: 4.2.12 | Ensure SSH X11 forwarding is disabled
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/^X11Forwarding no/'
    - '!/^X11Forwarding yes/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 4.2.12
      NISTSP800-53-R5:
      - CM-7
  {{ end }}
{{ end }}
