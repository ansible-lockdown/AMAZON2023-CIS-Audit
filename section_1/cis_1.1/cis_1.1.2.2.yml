---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_2_2 }}
mount:
  tmp_nodev:
    title: 1.1.2.2 | Ensure nodev option set on /tmp partition
    exists: true
    mountpoint: /tmp
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.2
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NISTSP800-53-R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
