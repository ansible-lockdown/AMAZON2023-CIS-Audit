---

{{ if .Vars.audit_run_heavy_tests }}
  {{ if .Vars.amzn2023cis_level_1 }}
    {{ if .Vars.amzn2023cis_rule_6_1_10 }}
command:
  world_writable:
    title: 6.1.10 | Audit system file permissions
    exec: "df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -perm -0002"
    exit-status:
      or:
      - 0
      - 123
    stdout:
    - '!/./'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.10
      NISTSP800-53-R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
