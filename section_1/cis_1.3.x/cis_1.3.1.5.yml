---

{{ if not .Vars.amzn2023cis_selinux_disable }}
  {{ if .Vars.amzn2023cis_level_2 }}
    {{ if .Vars.amzn2023cis_rule_1_3_1_5 }}
command:
  getenforce_enforcing:
    title: 1.3.1.5 | Ensure the SELinux mode is enforcing | running
    exit-status: 0
    exec: "getenforce"
    stdout:
    - '/^Enforcing/'
    skip: {{ ne .Vars.amzn2023cis_selinux_enforce "enforcing" }}
    skip-reason: the SELinux mode is not set to enforcing, amzn2023cis_selinux_enforce is not enforcing
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 1.3.1.5
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - SC-3
      - SI-6
      CCI:
      - CCI-001084
      - CCI-002696
file:
  /etc/selinux/config:
    title: 1.3.1.5 | Ensure the SELinux mode is enforcing | config
    exists: true
    contents:
    - '/^SELINUX( |)=( |)enforcing/'
    skip: {{ ne .Vars.amzn2023cis_selinux_enforce "enforcing" }}
    skip-reason: the SELinux mode is not set to enforcing, amzn2023cis_selinux_enforce is not enforcing
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 1.3.1.5
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - SC-3
      - SI-6
      CCI:
      - CCI-001084
      - CCI-002696
    {{ end }}
  {{ end }}
{{ end }}
