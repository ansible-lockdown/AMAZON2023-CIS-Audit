---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_7_1_6 }}
file:
  cis_7_1_6_shadow_backup:
    title: 7.1.6 | Ensure access to /etc/shadow- is configured
    path: /etc/shadow-
    exists: true
    owner: root
    group: root
    mode: '0000'
    skip: {{ not .Discovered.shadow_backup_exists }}
    skip-reason: /etc/shadow- is a backup written by account-management tools and does not exist on this host
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 7.1.6
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
