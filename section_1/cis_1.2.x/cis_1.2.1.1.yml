---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_2_1_1 }}
command:
  gpg_keys:
    title: 1.2.1.1 | Ensure GPG keys are configured | Amazon Linux 2023 release key installed
    exec: rpm -q gpg-pubkey --queryformat '%{VERSION} %{PACKAGER}\n'
    exit-status: 0
    stdout:
    - '/^d832c631 Amazon Linux <amazon-linux@amazon.com>$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.1.1
      CISv8:
      - 7.3
      - 7.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
