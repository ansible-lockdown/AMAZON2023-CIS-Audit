---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_3_3_1_1 }}
kernel-param:
  net.ipv4.ip_forward:
    title: 3.3.1.1 | Ensure net.ipv4.ip_forward is configured | running config
    skip: {{ .Vars.amzn2023cis_is_router }}
    skip-reason: this host is a router, amzn2023cis_is_router is true
    value: '0'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 3.3.1.1
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
command:
  cis_3_3_1_1_sysctl_conf:
    title: 3.3.1.1 | Ensure net.ipv4.ip_forward is configured | effective systemd-sysctl config
    skip: {{ .Vars.amzn2023cis_is_router }}
    skip-reason: this host is a router, amzn2023cis_is_router is true
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv4(\.|/)ip_forward\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv4.ip_forward=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv4\.ip_forward=0$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 3.3.1.1
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
  {{ end }}
{{ end }}
