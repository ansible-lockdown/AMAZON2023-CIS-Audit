---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_3_3_1_2 }}
kernel-param:
  net.ipv4.conf.all.forwarding:
    title: 3.3.1.2 | Ensure net.ipv4.conf.all.forwarding is configured | running config
    skip: {{ .Vars.amzn2023cis_is_router }}
    skip-reason: this host is a router, amzn2023cis_is_router is true
    value: '0'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.1.2
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
command:
  cis_3_3_1_2_sysctl_conf:
    title: 3.3.1.2 | Ensure net.ipv4.conf.all.forwarding is configured | effective systemd-sysctl config
    skip: {{ .Vars.amzn2023cis_is_router }}
    skip-reason: this host is a router, amzn2023cis_is_router is true
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv4(\.|/)conf(\.|/)all(\.|/)forwarding\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv4.conf.all.forwarding=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv4\.conf\.all\.forwarding=0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.1.2
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
  {{ end }}
{{ end }}
