---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_17 }}
command:
  cis_2_1_17_mta_listening_ports:
    title: 2.1.17 | Ensure mail transfer agents are configured for local-only mode | not listening on non-loopback
    skip: {{ .Vars.amzn2023cis_is_mail_server }}
    skip-reason: this host is a mail server, amzn2023cis_is_mail_server is true
    exec: ss -plntu | grep -P -- ':(25|465|587)\b' | grep -Pv -- '\h+(127\.0\.0\.1|\[?::1\]?):(25|465|587)\b'
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.17
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  cis_2_1_17_postfix_inet_interfaces:
    title: 2.1.17 | Ensure mail transfer agents are configured for local-only mode | postfix inet_interfaces
    skip: {{ .Vars.amzn2023cis_is_mail_server }}
    skip-reason: this host is a mail server, amzn2023cis_is_mail_server is true
    exec: |
      if command -v postconf >/dev/null 2>&1; then
        postconf -h inet_interfaces | grep -Piv -- '^\h*(loopback-only|localhost|127\.0\.0\.1|\[?::1\]?)(\h*[,\h]\h*(localhost|127\.0\.0\.1|\[?::1\]?))*\h*$'
      fi
      true
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.17
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
