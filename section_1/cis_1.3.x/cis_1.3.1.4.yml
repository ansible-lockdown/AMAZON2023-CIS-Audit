---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if not .Vars.amzn2023cis_selinux_disable }}
    {{ if .Vars.amzn2023cis_rule_1_3_1_4 }}
command:
  getenforce_set:
    title: 1.3.1.4 | Ensure the SELinux mode is not disabled
    exit-status: 0
    exec: "getenforce"
    stdout:
    - '/^(Enforcing|Permissive)/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.3.1.4
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-3
    {{ end }}
  {{ end }}
{{ end }}
