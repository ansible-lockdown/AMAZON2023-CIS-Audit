---

{{ if .Vars.amzn2023cis_level_1 }}
    {{ if .Vars.amzn2023cis_rule_1_1_4_4 }}
mount:
  var_tmp_nodev_opts:
    title: 1.1.4.4 | Ensure nodev option set on /var/tmp partition
    exists: true
    mountpoint: /var/tmp
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.4.4
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
