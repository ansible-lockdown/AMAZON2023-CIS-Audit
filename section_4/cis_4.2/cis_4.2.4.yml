---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_2_4 }}
command:
  sshd_access_limited:
    title: 4.2.4 | Ensure SSH access is limited
    exec: grep -hEi "^\s*(Allow|Deny)(Users|Groups)\s" /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/(?i)^\s*(Allow|Deny)(Users|Groups)\s+\S+/'
    {{ if .Vars.amzn2023cis_sshd_allowusers }}
    - '/(?i)^\s*AllowUsers\s+{{ .Vars.amzn2023cis_sshd_allowusers }}/'
    {{ end }}
    {{ if .Vars.amzn2023cis_sshd_allowgroups }}
    - '/(?i)^\s*AllowGroups\s+{{ .Vars.amzn2023cis_sshd_allowgroups }}/'
    {{ end }}
    {{ if .Vars.amzn2023cis_sshd_denyusers }}
    - '/(?i)^\s*DenyUsers\s+{{ .Vars.amzn2023cis_sshd_denyusers }}/'
    {{ end }}
    {{ if .Vars.amzn2023cis_sshd_denygroups }}
    - '/(?i)^\s*DenyGroups\s+{{ .Vars.amzn2023cis_sshd_denygroups }}/'
    {{ end }}
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.2.4
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
