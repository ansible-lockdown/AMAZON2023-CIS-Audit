---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_4_1_9 }}
file:
  cis_2_4_1_9_cron_deny:
    title: 2.4.1.9 | Ensure access to crontab is configured | cron.deny absent
    skip: {{ not .Discovered.cronie_installed }}
    skip-reason: cron is not installed, cronie package absent
    path: /etc/cron.deny
    exists: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.4.1.9
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  cis_2_4_1_9_cron_allow:
    title: 2.4.1.9 | Ensure access to crontab is configured | cron.allow
    skip: {{ not .Discovered.cronie_installed }}
    skip-reason: cron is not installed, cronie package absent
    path: /etc/cron.allow
    exists: true
    owner: root
    group:
      or:
      - root
      - crontab
    mode:
      match-regexp: '^0[0246][04]0$'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.4.1.9
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
