---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_3_3_4_2 }}
file:
  pam_unix_remember_password-auth:
    title: 5.3.3.4.2 | Ensure pam_unix does not include remember | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '!/.*pam_unix.so.*remember/'
    skip: {{ not .Vars.amzn2023cis_disruption_high }}
    skip-reason: amzn2023cis_disruption_high is false, the role does not change this setting
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.3.4.2
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  pam_unix_remember_system-auth:
    title: 5.3.3.4.2 | Ensure pam_unix does not include remember | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '!/.*pam_unix.so.*remember/'
    skip: {{ not .Vars.amzn2023cis_disruption_high }}
    skip-reason: amzn2023cis_disruption_high is false, the role does not change this setting
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.3.4.2
      CISv8: 5.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
