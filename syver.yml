---

# Host facts that decide whether a test applies; the test is skipped with a reason when it does not
# Partitions the role only checks when they exist (1.1.2.3 - 1.1.2.7 mount options)
discovery:
  mount:
    /home:
      register: home_mounted
      exists: true
    /var:
      register: var_mounted
      exists: true
    /var/tmp:
      register: var_tmp_mounted
      exists: true
    /var/log:
      register: var_log_mounted
      exists: true
    /var/log/audit:
      register: var_log_audit_mounted
      exists: true
  # 2.4.x cron and at checks only apply when the package is installed
  package:
    cronie:
      register: cronie_installed
      installed: true
    at:
      register: at_installed
      installed: true
  # 2.4.1.7 no package creates /etc/cron.yearly; 3.3.2.1 force_forwarding is absent on the 6.1 kernel
  # 7.1.x backup and opasswd files the benchmark says may not exist
  file:
    /etc/cron.yearly:
      register: cron_yearly_present
      exists: true
    /proc/sys/net/ipv6/conf/all/force_forwarding:
      register: ipv6_force_forwarding_present
      exists: true
    # 6.2.3.8 / 6.2.3.9 directory watch rules are only written when the directory exists
    /etc/NetworkManager/system-connections:
      register: nm_system_connections_dir
      exists: true
    /etc/systemd/network:
      register: systemd_network_dir
      exists: true
    # 6.2.3.23 the faillock watch is only written when the directory exists (pam_faillock creates it)
    /var/run/faillock:
      register: faillock_dir
      exists: true
    /etc/passwd-:
      register: passwd_backup_exists
      exists: true
    /etc/group-:
      register: group_backup_exists
      exists: true
    /etc/shadow-:
      register: shadow_backup_exists
      exists: true
    /etc/gshadow-:
      register: gshadow_backup_exists
      exists: true
    /etc/security/opasswd:
      register: opasswd_exists
      exists: true
    /etc/security/opasswd.old:
      register: opasswd_old_exists
      exists: true

syverfile:
# Section 1
  {{ if .Vars.amzn2023cis_section1 }}
  section_1/cis_1.1.1.x/*.yml: {}
  section_1/cis_1.1.2.x/*.yml: {}
  section_1/cis_1.2.x/*.yml: {}
  section_1/cis_1.3.x/*.yml: {}
  section_1/cis_1.4.x/*.yml: {}
  section_1/cis_1.5.x/*.yml: {}
  section_1/cis_1.6.x/*.yml: {}
  section_1/cis_1.7.x/*.yml: {}
  section_1/cis_1.8/*.yml: {}
  {{ end }}

# Section 2
  {{ if .Vars.amzn2023cis_section2 }}
  section_2/*/*.yml: {}
  {{ end }}

# Section 3
  {{ if .Vars.amzn2023cis_section3 }}
  section_3/cis_3.1/*.yml: {}
  section_3/cis_3.2/*.yml: {}
  # IPv4 kernel parameters
  section_3/cis_3.3.1/*.yml: {}
  # IPv6 kernel parameters
  section_3/cis_3.3.2/*.yml: {}
  {{ end }}

# Section 4 - firewall configuration
  {{ if .Vars.amzn2023cis_section4 }}
    {{ if eq .Vars.amzn2023cis_firewall "firewalld" }}
  section_4/cis_4.1/*.yml: {}
    {{ end }}
  {{ end }}

# Section 5
  {{ if .Vars.amzn2023cis_section5 }}
  section_5/cis_5.*/*.yml: {}
  {{ end }}

# Section 6
  {{ if .Vars.amzn2023cis_section6 }}
  # Journald and rsyslog
  section_6/cis_6.1.1.x/*.yml: {}
  section_6/cis_6.1.2.x/*.yml: {}
  # Logfiles
  section_6/cis_6.1.3/*.yml: {}
  # Auditd and level 2
    {{ if .Vars.amzn2023cis_level_2 }}
  section_6/cis_6.2.*/*.yml: {}
    {{ end }}
  # Aide
  section_6/cis_6.3/*.yml: {}
  {{ end }}

# Section 7
  {{ if .Vars.amzn2023cis_section7 }}
  section_7/cis_7.*/*.yml: {}
  {{ end }}

# Metadata
command:
  benchmark_meta:
    title: Benchmark MetaData
    exec: echo BenchMark MetaData
    exit-status: 0
    meta:
      host_machine_uuid: {{ .Vars.machine_uuid }}
      host_epoch: {{ .Vars.epoch }}
      host_os_locale: {{ .Vars.os_locale }}
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_automation_group: {{ .Vars.auto_group }}
      host_hostname: {{ .Vars.os_hostname }}
      host_system_type: {{ .Vars.system_type }}
      benchmark_type: {{ .Vars.benchmark_type }}
      benchmark_version: {{ .Vars.benchmark_version }}
      benchmark_os: {{ .Vars.benchmark_os }}
