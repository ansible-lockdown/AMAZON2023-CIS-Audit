---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_3 }}
    {{ if not .Vars.amzn2023cis_dns_mask }}
package:
  cis_2_1_3_bind_pkg:
    title: 2.1.3 | Ensure dns server services are not in use | bind not installed
    skip: {{ .Vars.amzn2023cis_dns_server }}
    skip-reason: a DNS server is required, amzn2023cis_dns_server is true
    name: bind
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.3
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.amzn2023cis_dns_mask }}
service:
  cis_2_1_3_named_service_masked:
    title: 2.1.3 | Ensure dns server services are not in use | named.service masked
    skip: {{ .Vars.amzn2023cis_dns_server }}
    skip-reason: a DNS server is required, amzn2023cis_dns_server is true
    name: named.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.3
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
