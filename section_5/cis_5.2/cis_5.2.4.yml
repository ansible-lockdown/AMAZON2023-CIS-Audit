---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_2_4 }}
command:
  pty_sudoers_d_not_disabled:
    title: 5.2.4 | Ensure sudo commands use pty | !use_pty not set
    exec: grep -rPi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?!use_pty\b' /etc/sudoers /etc/sudoers.d/
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-6
  {{ end }}
{{ end }}
