---

{{ if .Vars.amzn2023cis_rule_5_2_4_5 }}
command:
  audit_conf_perms:
    title: 5.2.4.5 | Ensure audit configuration files are 640 or more restrictive
    exec: find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \) -exec stat -Lc "%n %a" {} + | grep -Pv -- '^\h*\H+\h*([0,2,4,6][0,4]0)\h*$'
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.2.4.5
      NISTSP800-53-R5:
      - AU-3
{{ end }}
