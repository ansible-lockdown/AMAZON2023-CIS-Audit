      CIS_ID:
      - 2.1.10
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.amzn2023cis_rpc_mask }}
service:
  cis_2_1_10_rpcbind_socket_masked:
