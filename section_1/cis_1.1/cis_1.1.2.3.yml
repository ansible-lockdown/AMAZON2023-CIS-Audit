---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_2_3 }}
mount:
  tmp_noexec_opts:
    title: 1.1.2.3 | Ensure noexec option set on /tmp partition
    exists: true
    mountpoint: /tmp
    opts:
    - noexec
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.3
      NISTSP800-53-R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
