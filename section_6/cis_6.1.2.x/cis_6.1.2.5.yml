---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_6_1_2_5 }}
command:
  rsyslog_d_dir_access:
    title: 6.1.2.5 | Ensure access to the /etc/rsyslog.d directory is configured
    {{ if and .Vars.amzn2023cis_level_1 .Vars.amzn2023cis_rule_6_1_2_1 }}
    depends-on:
    - package:rsyslog
    {{ end }}
    exec: 'find /etc/rsyslog.d/ -maxdepth 0 -type d \( ! -user root -o ! -group root -o -perm /0022 \) 2>/dev/null | wc -l'
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2.5
      CISv8:
      - 3.3
      - 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AC-3
  {{ end }}
{{ end }}
