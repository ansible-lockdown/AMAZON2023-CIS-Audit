---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_6_2_1 }}
file:
  accts_passwds:
    title: 6.2.1 | Ensure accounts in /etc/passwd use shadowed passwords
    path: /etc/passwd
    exists: true
    contents:
    - "/^.*:x:*/"
    - "!/^.*:[a-w][y-z]:.*"
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.2.1
      NISTSP800-53-R5:
      - IA-5
  {{ end }}
{{ end }}

