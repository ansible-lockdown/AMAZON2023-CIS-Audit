---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_2_5 }}
command:
  log_sudoers_d:
    title: 5.2.5 | Ensure sudo log file exists
    exec: grep -rPsi -- '^\h*Defaults\h+([^#\n\r]+,\h*)?logfile\h*=\h*\S+' /etc/sudoers /etc/sudoers.d/
    exit-status: 0
    stdout:
    - '/logfile\s*=/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.2.5
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-12
      - AU-3
  {{ end }}
{{ end }}
