---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_2_1_18 }}
package:
  {{ range mkSlice "gdm" "gnome-shell" "tigervnc-server" }}
  cis_2_1_18_{{ . }}_pkg:
    title: 2.1.18 | Ensure a graphical user interface is not in use | {{ . }} not installed
    skip: {{ $.Vars.amzn2023cis_gui }}
    skip-reason: a graphical user interface is required, amzn2023cis_gui is true
    name: {{ . }}
    installed: false
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 2.1.18
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
command:
  cis_2_1_18_default_target:
    title: 2.1.18 | Ensure a graphical user interface is not in use | default target not graphical
    skip: {{ .Vars.amzn2023cis_gui }}
    skip-reason: a graphical user interface is required, amzn2023cis_gui is true
    exec: systemctl get-default
    exit-status: 0
    stdout:
    - '/\.target$/'
    - '!/^graphical\.target$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 2.1.18
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
  {{ end }}
{{ end }}
