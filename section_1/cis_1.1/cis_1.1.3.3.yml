    title: 1.1.3.3 | Ensure nosuid option set on /var partition
    exists: true
    mountpoint: /var
    opts:
    - nosuid
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 1.1.3.3
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
