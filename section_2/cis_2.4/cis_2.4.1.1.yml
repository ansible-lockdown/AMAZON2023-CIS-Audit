---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_4_1_1 }}
service:
  cis_2_4_1_1_crond:
    title: 2.4.1.1 | Ensure cron daemon is enabled and active
    skip: {{ not .Discovered.cronie_installed }}
    skip-reason: cron is not installed, cronie package absent
    name: crond.service
    enabled: true
    running: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.4.1.1
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
