---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_9 }}
command:
  usb-storage:
    title: 1.1.9 | Ensure usb-storage is disabled
    exit-status: 0
    exec: "modprobe -n -v usb-storage | grep -E '(usb-storage|install)'"
    stdout:
    - install /bin/true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.9
      NISTSP800-53-R5: SI-3
file:
  blacklist_usb:
    title: 1.1.9 | Ensure usb-storage is disabled | blacklist
    exists: true
    path: /etc/modprobe.d/blacklist.conf
    contents:
    - '/^blacklist usb-storage/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.9
      NISTSP800-53-R5: SI-3
  {{ end }}
{{ end }}
