---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_2_7_3 }}
mount:
  var_log_audit_nosuid_options:
    title: 1.1.2.7.3 | Ensure nosuid option set on /var/log/audit partition
    skip: {{ not .Discovered.var_log_audit_mounted }}
    skip-reason: /var/log/audit is not a separate partition
    mountpoint: '/var/log/audit'
    exists: true
    opts:
    - nosuid
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.7.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  var_log_audit_nosuid_fstab_options:
    title: 1.1.2.7.3 | Ensure nosuid option set on /var/log/audit partition
    skip: {{ not .Discovered.var_log_audit_mounted }}
    skip-reason: /var/log/audit is not a separate partition
    exists: true
    path: /etc/fstab
    contents:
    - '/\s\/var\/log\/audit\s.*nosuid/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.7.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
