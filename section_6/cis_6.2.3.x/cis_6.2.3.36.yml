---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_6_2_3_36 }}
command:
  auditd_6_2_3_36_immutable:
    title: 6.2.3.36 | Ensure the audit configuration is immutable
    exec: 'grep -Ph -- ''^\h*-e\h+2\b'' /etc/audit/rules.d/*.rules | tail -1'
    exit-status: 0
    stdout:
    - '/^\s*-e\s+2\b/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.36
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-9
  {{ end }}
{{ end }}
