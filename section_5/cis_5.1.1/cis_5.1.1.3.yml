---

{{ if .Vars.amzn2023cis_rule_5_1_1_3 }}
file:
  /etc/systemd/journald.conf:
    title: 5.1.1.3 | Ensure journald is configured to send logs to rsyslog
    exists: true
    contents:
    - '/^ForwardToSyslog=yes/'
    - '!/^ForwardToSyslog=[Nn][Oo]/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.1.1.3
      NISTSP800-53-R5:
      - AC-3
      - AU-2
      - AU-4
      - AU-12
      - MP-2
      - SI-5
{{ end }}
