---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_5_2 }}
mount:
  var_log_nodev_opts:
    title: 1.1.5.2 | Ensure nodev option set on /var/log partition
    exists: true
    mountpoint: /var/log
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.5.2
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
