    group: root
    contents:
    - "![Cc]ent[Oo][Ss]"
    - "![Rr]hel"
    - "![Rr]ed[Hh]at"
    - "!x86_64"
    - "![Ll]inux"
    - "![Aa]mazon"
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.7.1
      NISTSP800-53-R5:
      - CM-3
  {{ end }}
{{ end }}
