---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_11 }}
    {{ if not .Vars.amzn2023cis_rsync_mask }}
package:
  cis_2_1_11_rsync_daemon_pkg:
    title: 2.1.11 | Ensure rsync services are not in use | rsync-daemon not installed
    skip: {{ .Vars.amzn2023cis_rsync_server }}
    skip-reason: an rsync server is required, amzn2023cis_rsync_server is true
    name: rsync-daemon
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.11
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.amzn2023cis_rsync_mask }}
service:
  cis_2_1_11_rsyncd_socket_masked:
    title: 2.1.11 | Ensure rsync services are not in use | rsyncd.socket masked
    skip: {{ .Vars.amzn2023cis_rsync_server }}
    skip-reason: an rsync server is required, amzn2023cis_rsync_server is true
    name: rsyncd.socket
    masked: true
    meta:
