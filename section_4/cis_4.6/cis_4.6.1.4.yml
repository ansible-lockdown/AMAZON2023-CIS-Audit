---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_6_1_4 }}
command:
  inactive_passwd:
    title: 4.6.1.4 | Ensure inactive password lock is 30 days or less | password
    exec: useradd -D | grep INACTIVE
    exit-status: 0
    stdout:
    - '/^INACTIVE=([1-9]|[12][0-9]|30)$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.6.1.4
      NISTSP800-53-R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  inactive_users:
    title: 4.6.1.4 | Ensure inactive password lock is 30 days or less | users
    exec: "awk -F: '($2 ~ /^\\$.+\\$/) && ($7 == \"\" || $7 < 0 || $7 > 30) {print $1 \":\" $7}' /etc/shadow"
    stdout:
    - '!/./'
    exit-status: 0
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.6.1.4
      NISTSP800-53-R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
