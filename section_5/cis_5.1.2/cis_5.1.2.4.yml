---

{{ if .Vars.amzn2023cis_rule_5_1_2_4 }}
command:
  storage_journald_conf:
    title: 5.1.2.4 | Ensure journald is configured to write logfiles to persistent disk
    exec: grep -i storage /etc/systemd/journald.conf
    exit-status: 0
    stdout:
    - '/^Storage=persistent/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2.4
      NISTSP800-53-R5:
      - AU-3
      - AU-12
{{ end }}
