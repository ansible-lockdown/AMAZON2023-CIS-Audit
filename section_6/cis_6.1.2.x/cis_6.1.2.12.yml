---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_6_1_2_12 }}
command:
  rsyslog_tls_cafile_conf:
    title: 6.1.2.12 | Ensure rsyslog TLS CA certificate is configured | configured
    skip: {{ not (and .Vars.amzn2023cis_remote_log_server .Vars.amzn2023cis_remote_log_tls) }}
    skip-reason: TLS log forwarding is not configured (amzn2023cis_remote_log_server and amzn2023cis_remote_log_tls are not both true)
    {{ if and .Vars.amzn2023cis_level_1 .Vars.amzn2023cis_rule_6_1_2_1 }}
    depends-on:
    - package:rsyslog
    {{ end }}
    exec: 'grep -Psih -- ''^[^#]*(DefaultNetstreamDriverCAFile|StreamDriver\.CAFile)\s*[= ]'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf'
    exit-status: 0
    stdout:
    - '/(?i)(DefaultNetstreamDriverCAFile|StreamDriver\.CAFile)\s*[= ]/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.1.2.12
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-17
  rsyslog_tls_cafile_cert:
    title: 6.1.2.12 | Ensure rsyslog TLS CA certificate is configured | certificate readable
    skip: {{ not (and .Vars.amzn2023cis_remote_log_server .Vars.amzn2023cis_remote_log_tls) }}
    skip-reason: TLS log forwarding is not configured (amzn2023cis_remote_log_server and amzn2023cis_remote_log_tls are not both true)
    {{ if and .Vars.amzn2023cis_level_1 .Vars.amzn2023cis_rule_6_1_2_1 }}
    depends-on:
    - package:rsyslog
    {{ end }}
    exec: 'openssl x509 -in {{ .Vars.amzn2023cis_remote_log_tls_cafile }} -noout -subject'
    exit-status: 0
    stdout:
    - '/^subject\s*=/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.1.2.12
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-17
  {{ end }}
{{ end }}
