---

{{ if .Vars.amzn2023cis_level_1 }}
    {{ if .Vars.amzn2023cis_rule_1_1_4_3 }}
mount:
  var_tmp_nosuid_opts:
    title: 1.1.4.3 | Ensure nosuid option set on /var/tmp partition
    exists: true
    mountpoint: /var/tmp
    opts:
    - nosuid
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.4.3
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
