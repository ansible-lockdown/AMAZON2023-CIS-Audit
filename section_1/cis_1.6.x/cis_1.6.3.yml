---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_6_3 }}
file:
  crypto_policies_no_weakmacs:
    title: 1.6.3 | Ensure system wide crypto policy macs are configured
    path: /etc/crypto-policies/state/CURRENT.pol
    exists: true
    contents:
    - '/(?i)^\s*mac\s*=/'
    - '!/(?i)^\s*mac(@[^=\s]+)?\s*=\s*([^#]+)?-64\b/'
    skip: {{ not .Vars.amzn2023cis_crypto_policy_ansiblemanaged }}
    skip-reason: the crypto policy is not managed, amzn2023cis_crypto_policy_ansiblemanaged is false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.6.3
      CISv8:
      - 3.10
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
