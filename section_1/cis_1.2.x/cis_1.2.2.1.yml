---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_2_2_1 }}
command:
  security-updates:
    title: 1.2.2.1 | Ensure updates, patches, and additional security software are installed | configured release
    skip: {{ not .Vars.run_heavy_tests }}
    skip-reason: heavy tests are off, run_heavy_tests is false
    exec: dnf check-update
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.2.1
      CISv8:
      - 7.3
      - 7.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SI-2
  release-updates:
    title: 1.2.2.1 | Ensure updates, patches, and additional security software are installed | no newer release
    skip: {{ not .Vars.run_heavy_tests }}
    skip-reason: heavy tests are off, run_heavy_tests is false
    exec: dnf check-release-update 2>&1
    exit-status: 0
    stdout:
    - '!/--releasever=/'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.2.1
      CISv8:
      - 7.3
      - 7.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
