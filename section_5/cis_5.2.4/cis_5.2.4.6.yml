---

{{ if .Vars.amzn2023cis_rule_5_2_4_6 }}
command:
  audit_conf_owner:
    title: 5.2.4.6 | Ensure audit configuration files are owned by root
    exec: for file  in `find /etc/audit/ -type f \( -name '*.conf' -o -name '*.rules' \)`; do stat -Lc " %n_%U" $file; done
    exit-status: 0
    stdout:
    - '/.*_root$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.2.4.6
      NISTSP800-53-R5:
      - AU-3
{{ end }}
