---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_6_3_4 }}
command:
  aide_report_url_syslog:
    title: 6.3.4 | Ensure report_url is configured
    exec: 'grep -P ''^\h*report_url'' /etc/aide.conf'
    exit-status: 0
    stdout:
    - '/^\s*report_url\s*=\s*syslog:\S+/'
    skip: {{ not .Vars.amzn2023cis_config_aide }}
    skip-reason: AIDE is not managed (amzn2023cis_config_aide is false)
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.3.4
      CISv8:
      - 3.14
      CISv8_IG1: false
      CISv8_IG2: false
      CISv8_IG3: true
      NIST800-53R5:
      - SI-7
      - SI-7(2)
  {{ end }}
{{ end }}
