      workstation: NA
      CIS_ID:
      - 2.1.11
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
  cis_2_1_11_rsyncd_service_masked:
    title: 2.1.11 | Ensure rsync services are not in use | rsyncd.service masked
    skip: {{ .Vars.amzn2023cis_rsync_server }}
    skip-reason: an rsync server is required, amzn2023cis_rsync_server is true
    name: rsyncd.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.11
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
