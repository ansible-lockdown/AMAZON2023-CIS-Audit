---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_2_3_3 }}
mount:
  home_nosuid_options:
    title: 1.1.2.3.3 | Ensure nosuid option set on /home partition
    skip: {{ not .Discovered.home_mounted }}
    skip-reason: /home is not a separate partition
    mountpoint: /home
    exists: true
    opts:
    - nosuid
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.3.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
file:
  home_nosuid_fstab_options:
    title: 1.1.2.3.3 | Ensure nosuid option set on /home partition
    skip: {{ not .Discovered.home_mounted }}
    skip-reason: /home is not a separate partition
    exists: true
    path: /etc/fstab
    contents:
    - '/\s\/home\s.*nosuid/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.2.3.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
