---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_5_4_1_2 }}
file:
  login_defs_min_days:
    title: 5.4.1.2 | Ensure minimum password days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^\s*PASS_MIN_DAYS\s+[1-9][0-9]*\b/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.4.1.2
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5(1)
command:
  check_users_min_days:
    title: 5.4.1.2 | Ensure minimum password days is configured | existing users
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($4 < 1) print "FAIL: " $1 " PASS_MIN_DAYS: " $4}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    skip: {{ not .Vars.amzn2023cis_force_user_mindays }}
    skip-reason: amzn2023cis_force_user_mindays is false, existing accounts are not changed by the role
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.4.1.2
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5(1)
  {{ end }}
{{ end }}
