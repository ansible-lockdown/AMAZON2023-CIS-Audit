---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_6_1_2_13 }}
command:
  rsyslog_tls_client_cert_conf:
    title: 6.1.2.13 | Ensure rsyslog TLS client certificate is configured | configured
    skip: {{ not (and .Vars.amzn2023cis_remote_log_server .Vars.amzn2023cis_remote_log_tls) }}
    skip-reason: TLS log forwarding is not configured (amzn2023cis_remote_log_server and amzn2023cis_remote_log_tls are not both true)
    {{ if and .Vars.amzn2023cis_level_1 .Vars.amzn2023cis_rule_6_1_2_1 }}
    depends-on:
    - package:rsyslog
    {{ end }}
    exec: |
      grep -Psih -- '^[^#]*(DefaultNetstreamDriverCertFile|StreamDriver\.CertFile)\h*[= ]' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      grep -Psih -- '^[^#]*(DefaultNetstreamDriverKeyFile|StreamDriver\.KeyFile)\h*[= ]' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null
      echo check_complete
    exit-status: 0
    stdout:
    - '/^check_complete$/'
    - '/(?i)(DefaultNetstreamDriverCertFile|StreamDriver\.CertFile)\s*[= ]/'
    - '/(?i)(DefaultNetstreamDriverKeyFile|StreamDriver\.KeyFile)\s*[= ]/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.1.2.13
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-17
    {{ if .Vars.amzn2023cis_remote_log_tls_keyfile }}
  rsyslog_tls_client_key_access:
    title: 6.1.2.13 | Ensure rsyslog TLS client certificate is configured | private key access
    skip: {{ not (and .Vars.amzn2023cis_remote_log_server .Vars.amzn2023cis_remote_log_tls) }}
    skip-reason: TLS log forwarding is not configured (amzn2023cis_remote_log_server and amzn2023cis_remote_log_tls are not both true)
    {{ if and .Vars.amzn2023cis_level_1 .Vars.amzn2023cis_rule_6_1_2_1 }}
    depends-on:
    - package:rsyslog
    {{ end }}
    exec: 'stat -Lc ''%U %a'' {{ .Vars.amzn2023cis_remote_log_tls_keyfile }}'
    exit-status: 0
    stdout:
    - '/^root [0-7]00$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.1.2.13
      CISv8: 8.2
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SC-17
    {{ end }}
  {{ end }}
{{ end }}
