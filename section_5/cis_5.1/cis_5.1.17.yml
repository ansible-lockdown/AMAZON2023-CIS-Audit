---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_1_17 }}
command:
  sshd_authtries_live:
    title: 5.1.17 | Ensure sshd MaxAuthTries is configured
    exec: sshd -T 2>/dev/null | grep -i -- '^maxauthtries\s'
    exit-status: 0
    stdout:
    - '/(?i)^maxauthtries [1-4]$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.1.17
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-3
  {{ end }}
{{ end }}
