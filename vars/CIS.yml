# - false - leaves service in current status
# - true - sets service name to masked
#
# Setting both Service and Mask to false will remove the package if exists
#
amzn2023cis_bluetooth_service: false
amzn2023cis_bluetooth_mask: false

## IPv6 required
amzn2023cis_ipv6_required: true

# amzn2023cis_ipv6_disable defines the method of disabling IPv6, sysctl vs kernel
amzn2023cis_ipv6_disable_method: sysctl

## 3.3.1.1-3.3.1.5, 3.3.2.2-3.3.2.3 forwarding and send_redirects (host only OR host and router)
amzn2023cis_is_router: false

## Section 4
### Firewall
amzn2023cis_firewall: firewalld

# Section 4


# Section 5

amzn2023cis_sshd_config_file: /etc/ssh/sshd_config

## 5.1.8 Note the following to understand precedence and layout, comma separated
amzn2023cis_sshd_allowusers: ''
amzn2023cis_sshd_allowgroups:
amzn2023cis_sshd_denyusers: nobody
amzn2023cis_sshd_denygroups:

## 5.2.12 set sugroup if differs from wheel
amzn2023cis_sugroup: sugroup

## 5.3.2.1 Enable automation to create custom profile settings, using the settings above
amzn2023cis_authselect_custom_profile_create: true

## 5.3.2.1 Enable automation to select custom profile options, using the settings above
amzn2023cis_authselect_custom_profile_select: false

## 5.3.2.1 Authselect select false if using AD or RHEL ID mgmt
amzn2023cis_authselect_custom_profile_name: cis_example_profile

## 5.3.3.2.3 Set option used for password complexity
# either minclass or credits - enabling to check for one option in settings
amzn2023cis_passwd_complex_option: minclass

## 5.4.1.x login.defs password settings
amzn2023cis_pass_max_days: "365"
amzn2023cis_pass_min_days: "7"
amzn2023cis_pass_warn_age: "7"

# Section 6

# Control 6.1.x

# aide setup via - cron, timer
amzn2023cis_aide_scan: timer

## Logging 6.2.x.x

## syslog
## change to rsyslog/ journald or other

# Control 6.2.3.x
## Set if host is a logserver
amzn2023cis_remote_log_server: false

# Log server settings
amzn2023cis_system_is_log_server: false
amzn2023cis_remote_log_host: logagg.example.com
amzn2023cis_remote_log_port: 514
amzn2023cis_remote_log_protocol: tcp
amzn2023cis_remote_log_retrycount: 100
amzn2023cis_remote_log_queuesize: 1000
amzn2023cis_remote_log_tls: false
amzn2023cis_remote_log_tls_cafile: /etc/pki/tls/certs/ca-bundle.crt
amzn2023cis_remote_log_tls_keyfile: ''

# Control 7.1.12
amzn2023cis_exclude_unowned_search_path: \( ! -path "/run/user/*" -a ! -path "/proc/*" -a ! -path "*/containerd/*" -a ! -path "*/kubelet/pods/*" -a ! -path "*/kubelet/plugins/*" -a ! -path "/sys/fs/cgroup/memory/*" -a ! -path "/var/*/private/*" \)
