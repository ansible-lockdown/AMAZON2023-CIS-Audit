---

{{ if .Vars.audit_run_heavy_tests }}
  {{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_6_1_12 }}
command:
  unowned:
    title: 6.1.12 | Ensure no unowned or ungrouped files or directories exist
    exec: "df --local -P | awk {'if (NR!=1) print $6'} | xargs -I '{}' find '{}' -xdev -nouser -nogroup"
    exit-status:
      or:
      - 0
      - 123
    stdout:
    - '!/./'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.12
      NISTSP800-53-R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
