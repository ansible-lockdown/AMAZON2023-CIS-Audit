---

{{ if .Vars.amzn2023cis_rule_5_1_2_7 }}
command:
  /etc/tmpfiles.d/systemd.conf:
    title: 5.1.2.7 | Ensure journald default file permissions configured | Manual Check Required
    exec: echo "Manual - Please check journald default permissions"
    exit-status: 0
    stdout:
    - '!/^Manual/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2.7
      NISTSP800-53-R5:
      - AC-3
      - AU-2
      - AU-12
      - MP-2
      - SI-5
{{ end }}
