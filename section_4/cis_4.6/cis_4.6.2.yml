---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_6_2 }}
command:
  secure_system_accts:
    title: 4.6.2 | Ensure system accounts are secured
    exec: |
      awk -F: '($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3<'"$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)"' || $3 == 65534) && $7!~/^(\/usr)?\/sbin\/nologin$/) { print $1 }' /etc/passwd
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.6.2
      NISTSP800-53-R5:
      - AC-2
      - AC-3
      - AC-5
      - MP-2
  secure_system_LK:
    title: 4.6.2 | Ensure system accounts are secured
    exec: |
      awk -F: '/nologin/ {print $1}' /etc/passwd | xargs -I '{}' passwd -S '{}' | awk '($2!="L" && $2!="LK") {print $1}'
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.6.2
      NISTSP800-53-R5:
      - AC-2
      - AC-3
      - AC-5
      - MP-2
  {{ end }}
{{ end }}
