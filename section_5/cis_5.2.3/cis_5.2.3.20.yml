---

{{ if .Vars.amzn2023cis_rule_5_2_3_20 }}
command:
  auditd_immutable:
    title: 5.2.3.20 | Ensure the audit configuration is immutable
    exec: 'grep "-e 2" /etc/audit/rules.d/*.rules | tail -1'
    exit-status: 0
    stdout:
    - '-e 2'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.2.3.20
      NISTSP800-53-R5:
      - AC-3
      - AU-3
      - AU-12
      - MP-2
{{ end }}
