---

{{ if .Vars.amzn2023cis_gui }}
  {{ if .Vars.amzn2023cis_level_1 }}
    {{ if .Vars.amzn2023cis_rule_1_8_6 }}
command:
  gdm_xdmcp_disabled:
    title: 1.8.6 | Ensure XDMCP is not enabled
    exec: echo "xdmcp_enabled_lines=$(for f in /etc/gdm/custom.conf /etc/gdm/daemon.conf; do [ -f "$f" ] && awk '/\[xdmcp\]/{f=1;next} /\[/{f=0} f && /^\s*Enable\s*=\s*true/' "$f"; done | wc -l)"
    exit-status: 0
    stdout:
    - '/^xdmcp_enabled_lines=0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.8.6
      NIST800-53R5: SI-4
    {{ end }}
  {{ end }}
{{ end }}
