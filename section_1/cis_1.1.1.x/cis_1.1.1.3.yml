---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_1_1_1_3 }}
command:
  modprobe_udf:
    title: 1.1.1.3 | Ensure udf kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+udf\b'
    exit-status: 0
    stdout:
    - '/^blacklist udf$/'
    - '/^install udf (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID: 1.1.1.3
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
file:
  sys_module_udf:
    title: 1.1.1.3 | Ensure udf kernel module is not available | not loaded
    path: /sys/module/udf
    exists: false
    meta:
      server: 2
      workstation: NA
      CIS_ID: 1.1.1.3
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
