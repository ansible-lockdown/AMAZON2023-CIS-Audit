---

{{ if not .Vars.amzn2023cis_selinux_disable }}
  {{ if .Vars.amzn2023cis_level_1 }}
    {{ if .Vars.amzn2023cis_rule_1_3_1_2 }}
command:
  selinux_disabled_boot:
    title: 1.3.1.2 | Ensure SELinux is not disabled in bootloader configuration
    exec: |
      echo "boot_entries=$(grubby --info=ALL 2>/dev/null | grep -Pc '^\h*args=.*\b(selinux|enforcing)=0\b')"
      echo "kernelopts=$(grep -PrsI -- '^\h*([^#\n\r]+\h+)?kernelopts=([^#\n\r]+\h+)?(selinux|enforcing)=0\b' /boot/grub2 /boot/efi | wc -l)"
      echo "kernel_cmdline=$(grep -Ps -- '\b(selinux|enforcing)=0\b' /etc/kernel/cmdline | wc -l)"
      echo "default_grub=$(grep -Psi -- '^\h*GRUB_CMDLINE_LINUX(_DEFAULT)?=.*\b(selinux|enforcing)=0\b' /etc/default/grub | wc -l)"
    exit-status: 0
    stdout:
    - '/^boot_entries=0$/'
    - '/^kernelopts=0$/'
    - '/^kernel_cmdline=0$/'
    - '/^default_grub=0$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.3.1.2
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
