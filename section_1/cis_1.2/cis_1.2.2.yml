---

{{ if .Vars.amzn2023cis_level_1 }}
command:
  {{ if .Vars.amzn2023cis_rule_1_2_2 }}
  gpg_check_global:
    title: 1.2.2 | Ensure gpgcheck is globally activated | dnf.conf
    exit-status: 0
    exec: 'grep -E "^\s*gpgcheck\s*=" /etc/dnf/dnf.conf'
    stdout:
    - '/^\s*gpgcheck\s*=\s*1\s*$/'
    - '!/^\s*gpgcheck\s*=\s*([^1\s]|1\S)/'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.2
      NISTSP800-53-R5: SI-2
  gpg_check_repo:
    title: 1.2.2 | Ensure gpgcheck is globally activated | yum.conf.d
    exit-status: 1
    exec: 'grep -Prs --include="*.repo" -- "^\h*gpgcheck\h*=\h*(0|[2-9]|[1-9][0-9]+|[a-zA-Z_]+)\b" /etc/yum.repos.d/'
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.2
      NISTSP800-53-R5: SI-2
  {{ end }}
{{ end }}
