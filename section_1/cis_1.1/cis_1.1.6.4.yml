---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_6_4 }}
mount:
  var_log_audit_nosuid_opts:
    title: 1.1.6.4 | Ensure nosuid option set on /var/log/audit partition
    exists: true
    mountpoint: /var/log/audit
    opts:
    - nosuid
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.6.4
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
