---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_6_2_3_34 }}
command:
  auditd_6_2_3_34_cnf:
    title: 6.2.3.34 | Ensure the audit task list is configured | conf check
    exec: |
      grep -Phs -- '^\h*-[aA]\h*(task,never|never,task)\b' /etc/audit/rules.d/*.rules
      echo check_complete
    exit-status: 0
    stdout:
    - '/^check_complete$/'
    - '!/(task,never|never,task)/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.34
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-12
  auditd_6_2_3_34_live:
    title: 6.2.3.34 | Ensure the audit task list is configured | running
    exec: |
      auditctl -l | grep -P -- '^-a\h+never,task\b'
      echo check_complete
    exit-status: 0
    stdout:
    - '/^check_complete$/'
    - '!/never,task/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.34
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-2
      - AU-12
  {{ end }}
{{ end }}
