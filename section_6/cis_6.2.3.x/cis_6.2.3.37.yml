---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_6_2_3_37 }}
command:
  auditd_conf_vs_live:
    title: 6.2.3.37 | Ensure the running and on disk configuration is the same
    exec: /usr/sbin/augenrules --check
    exit-status: 0
    stdout:
    - '/^\/usr\/sbin\/augenrules: No change/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.37
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-3
  {{ end }}
{{ end }}
