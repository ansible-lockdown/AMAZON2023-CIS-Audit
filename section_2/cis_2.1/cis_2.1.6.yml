---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_6 }}
    {{ if not .Vars.amzn2023cis_ftp_mask }}
package:
  cis_2_1_6_vsftpd_pkg:
    title: 2.1.6 | Ensure ftp server services are not in use | vsftpd not installed
    skip: {{ .Vars.amzn2023cis_ftp_server }}
    skip-reason: an FTP server is required, amzn2023cis_ftp_server is true
    name: vsftpd
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
    {{ if .Vars.amzn2023cis_ftp_mask }}
service:
  cis_2_1_6_vsftpd_service_masked:
    title: 2.1.6 | Ensure ftp server services are not in use | vsftpd.service masked
    skip: {{ .Vars.amzn2023cis_ftp_server }}
    skip-reason: an FTP server is required, amzn2023cis_ftp_server is true
    name: vsftpd.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.6
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
    {{ end }}
  {{ end }}
{{ end }}
