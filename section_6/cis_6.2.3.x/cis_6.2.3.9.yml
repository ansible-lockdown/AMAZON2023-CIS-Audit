---

{{ if .Vars.amzn2023cis_level_2 }}
  {{ if .Vars.amzn2023cis_rule_6_2_3_9 }}
command:
  auditd_6_2_3_9_cnf:
    title: 6.2.3.9 | Ensure events that modify the /etc/systemd/network directory are collected | conf check
    skip: {{ not .Discovered.systemd_network_dir }}
    skip-reason: /etc/systemd/network does not exist
    exec: 'grep -Phs -- ''/etc/systemd/network'' /etc/audit/rules.d/*.rules'
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/systemd/network/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/systemd/network/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.9
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_6_2_3_9_live:
    title: 6.2.3.9 | Ensure events that modify the /etc/systemd/network directory are collected | running
    skip: {{ not .Discovered.systemd_network_dir }}
    skip-reason: /etc/systemd/network does not exist
    exec: 'auditctl -l | grep -P -- ''/etc/systemd/network'''
    exit-status: 0
    stdout:
    - '/^\s*(-w /etc/systemd/network/? -p wa -k system-locale|-a (always,exit|exit,always)( -F arch=b(32|64))? -S all -F (path|dir)=/etc/systemd/network/? -F perm=wa (-k |-F key=)system-locale)\s*$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.3.9
      CISv8: 8.5
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
