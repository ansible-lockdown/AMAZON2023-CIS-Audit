---

{{ if .Vars.audit_run_heavy_tests }}
  {{ if .Vars.amzn2023cis_level_2 }}
    {{ if .Vars.amzn2023cis_rule_6_1_10 }}
command:
  rpm_filecheck:
    title: 6.1.10 | Audit system file permissions
    exec: "rpm -Va --nomtime --nosize --nomd5 --nolinkto > /tmp/cis_rpmcheck | grep -vw c && cat /tmp/cis_rpmcheck | wc -l"
    exit-status: 1
    stdout:
    - '0'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.1.10
      NISTSP800-53-R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
      - AC-3
      - MP-2
    {{ end }}
  {{ end }}
{{ end }}
