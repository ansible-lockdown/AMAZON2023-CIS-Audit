---

{{ if .Vars.amzn2023cis_level_1 }}
command:
  {{ if .Vars.amzn2023cis_rule_1_2_4 }}
  repo_gpg_check_global:
    title: 1.2.4 | Ensure repo_gpgcheck is globally activated | yum.conf
    exit-status: 0
    exec: "if [ `grep -c -E '^\\s*repo_gpgcheck.*0' /etc/yum.conf` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\\s*repo_gpgcheck.*1' /etc/yum.conf` -ge 1 ]; then echo Passed_Check;fi"
    stdout:
    - '!/FAIL/'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.4
      NISTSP800-53-R5: SI-2
  repo_gpg_check_repo:
    title: 1.2.4 | Ensure repo_gpgcheck is globally activated | yum.conf.d
    exit-status: 0
    exec: "if [ `grep -c -E '^\\s*repo_gpgcheck.*0' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo FAIL; elif [ `grep -c -E '^\\s*repo_gpgcheck.*1' /etc/yum.repos.d/*.repo` -ge 1 ]; then echo Passed_Check;fi"
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/FAIL/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.4
      NISTSP800-53-R5: SI-2
  {{ end }}
{{ end }}
