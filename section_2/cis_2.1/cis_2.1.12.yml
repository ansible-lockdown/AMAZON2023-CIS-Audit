---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_12 }}
    {{ if not .Vars.amzn2023cis_snmp_mask }}
package:
  cis_2_1_12_net_snmp_pkg:
    title: 2.1.12 | Ensure snmp services are not in use | net-snmp not installed
    skip: {{ .Vars.amzn2023cis_snmp_server }}
    skip-reason: an SNMP server is required, amzn2023cis_snmp_server is true
    name: net-snmp
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.12
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
    {{ if .Vars.amzn2023cis_snmp_mask }}
service:
  cis_2_1_12_snmpd_service_masked:
    title: 2.1.12 | Ensure snmp services are not in use | snmpd.service masked
    skip: {{ .Vars.amzn2023cis_snmp_server }}
    skip-reason: an SNMP server is required, amzn2023cis_snmp_server is true
    name: snmpd.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.12
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: CM-7
    {{ end }}
  {{ end }}
{{ end }}
