---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_5_3_2_1 }}
command:
  authselect_current_profile:
    title: 5.3.2.1 | Ensure PAM is managed by an active authselect profile | active profile
    exec: authselect current
    exit-status: 0
    stdout:
    - '/^Profile ID: \S+/'
    skip: {{ or (not .Vars.amzn2023cis_disruption_high) (not .Vars.amzn2023cis_allow_authselect_updates) }}
    skip-reason: amzn2023cis_disruption_high or amzn2023cis_allow_authselect_updates is false, authselect is not managed by the role
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.2.1
      CISv8: 16.2
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  authselect_check_5_3_2_1:
    title: 5.3.2.1 | Ensure PAM is managed by an active authselect profile | authselect check
    exec: authselect check
    exit-status: 0
    stdout:
    - '/Current configuration is valid/'
    skip: {{ or (not .Vars.amzn2023cis_disruption_high) (not .Vars.amzn2023cis_allow_authselect_updates) }}
    skip-reason: amzn2023cis_disruption_high or amzn2023cis_allow_authselect_updates is false, authselect is not managed by the role
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 5.3.2.1
      CISv8: 16.2
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
