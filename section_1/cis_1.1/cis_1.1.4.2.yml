---

{{ if .Vars.amzn2023cis_level_1 }}
    {{ if .Vars.amzn2023cis_rule_1_1_4_2 }}
mount:
  var_tmp_noexec_opts:
    title: 1.1.4.2 | Ensure noexec option set on /var/tmp partition
    exists: true
    mountpoint: /var/tmp
    opts:
    - noexec
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.4.2
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
