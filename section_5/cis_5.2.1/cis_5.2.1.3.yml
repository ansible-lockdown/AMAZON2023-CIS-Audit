---

{{ if .Vars.amzn2023cis_rule_5_2_1_3 }}
file:
  grub_audit_backlog:
    title: 5.2.1.3 | Ensure audit_backlog_limit is sufficient
    path: /etc/default/grub
    exists: true
    contents:
    - '/GRUB_CMDLINE_LINUX_DEFAULT=".*audit_backlog_limit={{ .Vars.amzn2023cis_auditd_back_log_limit }}/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.2.1.3
      NISTSP800-53-R5:
      - AU-2
      - AU-3
      - AU-12
{{ end }}
