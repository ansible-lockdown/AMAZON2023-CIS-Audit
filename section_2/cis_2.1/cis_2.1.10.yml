{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_10 }}
    {{ if not .Vars.amzn2023cis_rpc_mask }}
package:
  cis_2_1_10_rpcbind_pkg:
