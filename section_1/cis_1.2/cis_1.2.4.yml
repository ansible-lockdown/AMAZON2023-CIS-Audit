---

{{ if .Vars.amzn2023cis_level_2 }}
command:
  {{ if .Vars.amzn2023cis_rule_1_2_4 }}
  repo_gpg_check_global:
    title: 1.2.4 | Ensure repo_gpgcheck is globally activated | dnf.conf
    exit-status: 0
    exec: 'grep -E "^\s*repo_gpgcheck\s*=" /etc/dnf/dnf.conf'
    stdout:
    - '/^\s*repo_gpgcheck\s*=\s*1\s*$/'
    - '!/^\s*repo_gpgcheck\s*=\s*([^1\s]|1\S)/'
    timeout: {{ .Vars.timeout_ms }}
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 1.2.4
      NISTSP800-53-R5: SI-2
  repo_gpg_check_repo:
    title: 1.2.4 | Ensure repo_gpgcheck is globally activated | yum.repos.d
    exit-status: 1
    exec: 'grep -Prs --include="*.repo" -- "^\h*repo_gpgcheck\h*=\h*0\b" /etc/yum.repos.d/'
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/./'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 1.2.4
      NISTSP800-53-R5: SI-2
  {{ end }}
{{ end }}
