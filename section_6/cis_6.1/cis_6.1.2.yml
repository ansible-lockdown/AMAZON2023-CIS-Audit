---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_6_1_2 }}
command:
  passwd_perms_6_1_2:
    title: 6.1.2 | Ensure permissions on /etc/passwd are configured
    exec:  stat -L -c "%a %U %G" /etc/passwd
    exit-status: 0
    stdout:
    -  '/6[0,4][0,4] root root/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 6.1.2
      NISTSP800-53-R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
