---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_4_5_2 }}
file:
  password_auth_failed:
    title: 4.5.2 | Ensure lockout for failed password attempts is configured | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^account\s*required\s*pam_faillock.so/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.5.2
      NISTSP800-53-R5:
      - AC-1
      - AC-2
  system_auth_failed:
    title: 4.5.2 | Ensure lockout for failed password attempts is configured | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^account\s*required\s*pam_faillock.so/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.5.2
      NISTSP800-53-R5:
      - AC-1
      - AC-2
  faillock_conf:
    title: 4.5.2 | Ensure lockout for failed password attempts is configured | faillock.conf
    path: /etc/security/faillock.conf
    exists: true
    contents:
    - '/^\s*deny\s*=\s*{{ .Vars.amzn2023cis_pam_faillock_deny }}\s*$/'
    - '/^\s*unlock_time\s*=\s*{{ .Vars.amzn2023cis_pam_faillock_unlock_time }}\s*$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 4.5.2
      NISTSP800-53-R5:
      - AC-1
      - AC-2
  {{ end }}
{{ end }}
