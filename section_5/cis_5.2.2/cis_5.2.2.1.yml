---

{{ if .Vars.amzn2023cis_rule_5_2_2_1 }}
file:
  auditd_storage_size:
    title: 5.2.2.1 | Ensure audit log storage size is configured
    exists: true
    path: /etc/audit/auditd.conf
    contents:
    - '/^max_log_file(| )=(| ){{ .Vars.amzn2023cis_auditd_max_log_file_size }}/'
    - '/max_log_file(| )=(| )\d{1,6}/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 5.2.2.1
      NISTSP800-53-R5:
      - AU-8
{{ end }}
