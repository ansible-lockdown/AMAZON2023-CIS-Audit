---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_3_3_1_6 }}
kernel-param:
  net.ipv4.icmp_ignore_bogus_error_responses:
    title: 3.3.1.6 | Ensure net.ipv4.icmp_ignore_bogus_error_responses is configured | running config
    value: '1'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.1.6
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
command:
  cis_3_3_1_6_sysctl_conf:
    title: 3.3.1.6 | Ensure net.ipv4.icmp_ignore_bogus_error_responses is configured | effective systemd-sysctl config
    exec: |
      l_sysctl="$(readlink -e /usr/lib/systemd/systemd-sysctl || readlink -e /lib/systemd/systemd-sysctl)"
      l_value="$("$l_sysctl" --cat-config 2>/dev/null | grep -Pi -- '^\h*-?net(\.|/)ipv4(\.|/)icmp_ignore_bogus_error_responses\h*=' | tail -n 1 | cut -d= -f2 | xargs)"
      echo "net.ipv4.icmp_ignore_bogus_error_responses=$l_value"
    exit-status: 0
    stdout:
    - '/^net\.ipv4\.icmp_ignore_bogus_error_responses=1$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 3.3.1.6
      NIST800-53R5: CM-6
      CCI:
      - CCI-000366
  {{ end }}
{{ end }}
