---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_2_1_1 }}
    {{ if not .Vars.amzn2023cis_autofs_mask }}
package:
  cis_2_1_1_autofs_pkg:
    title: 2.1.1 | Ensure autofs services are not in use | autofs not installed
    skip: {{ .Vars.amzn2023cis_autofs_services }}
    skip-reason: autofs is required, amzn2023cis_autofs_services is true
    name: autofs
    installed: false
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.1
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - MP-7
      - SI-3
    {{ end }}
    {{ if .Vars.amzn2023cis_autofs_mask }}
service:
  cis_2_1_1_autofs_service_masked:
    title: 2.1.1 | Ensure autofs services are not in use | autofs.service masked
    skip: {{ .Vars.amzn2023cis_autofs_services }}
    skip-reason: autofs is required, amzn2023cis_autofs_services is true
    name: autofs.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.1
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - MP-7
      - SI-3
    {{ end }}
  {{ end }}
{{ end }}
