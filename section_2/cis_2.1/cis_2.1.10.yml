    name: rpcbind.service
    masked: true
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 2.1.10
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-6
      - CM-7
