---

{{ if .Vars.amzn2023cis_rule_5_1_2_3 }}
command:
  compress_journald_conf:
    title: 5.1.2.3 | Ensure journald is configured to compress large log files
    exec: grep -i compress /etc/systemd/journald.conf
    exit-status: 0
    stdout:
    - '/^Compress=yes/'
    - '!/^Compress=[Nn][Oo]/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2.3
      NISTSP800-53-R5:
      - AU-4
{{ end }}
