---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_8_2 }}
mount:
  dev_shm_nodev_opts:
    title: 1.1.8.2 | Ensure nodev option set on /dev/shm partition
    exists: true
    mountpoint: /dev/shm
    opts:
    - nodev
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.1.8.2
      NISTSP800-53-R5:
      - CM-7
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
