---

{{ if .Vars.amzn2023cis_level_1 }}
  {{ if .Vars.amzn2023cis_rule_1_1_1_4 }}
command:
  modprobe_usb_storage:
    title: 1.1.1.4 | Ensure usb-storage kernel module is not available | not loadable
    exec: modprobe --showconfig | grep -P -- '\b(install|blacklist)\h+usb_storage\b'
    exit-status: 0
    stdout:
    - '/^blacklist usb_storage$/'
    - '/^install usb_storage (\/usr)?\/bin\/(true|false)$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID: 1.1.1.4
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7(9)
      - IA-3
      CCI:
      - CCI-000778
      - CCI-001958
      - CCI-003959
file:
  sys_module_usb_storage:
    title: 1.1.1.4 | Ensure usb-storage kernel module is not available | not loaded
    path: /sys/module/usb_storage
    exists: false
    meta:
      server: 1
      workstation: NA
      CIS_ID: 1.1.1.4
      CISv8:
      - 4.8
      CISv8_IG1: false
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-7(9)
      - IA-3
      CCI:
      - CCI-000778
      - CCI-001958
      - CCI-003959
  {{ end }}
{{ end }}
